name: Refresh CTU major knowledge

on:
  schedule:
    # 09:00 every Monday in Viet Nam (02:00 UTC).
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install crawler dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Crawl and validate official CTU pages
        run: python graphRAG/knowledge/update_ctu_majors.py

      - name: Commit changed knowledge only
        shell: bash
        run: |
          if git diff --quiet -- graphRAG/knowledge/ctu_majors.json; then
            echo "CTU knowledge is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphRAG/knowledge/ctu_majors.json
          git commit -m "chore: refresh CTU major knowledge"
          git push
